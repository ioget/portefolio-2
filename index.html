<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamekem Rosly | Cybersecurity & AI Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        (function () {
          try {
            var k = 'portfolio-theme';
            var p = localStorage.getItem(k);
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var light = p === 'light' ? true : p === 'dark' ? false : !prefersDark;
            if (light) {
              document.documentElement.classList.add('light');
              document.documentElement.style.backgroundColor = '#f3f4f6';
              document.body.style.backgroundColor = '#f3f4f6';
            } else {
              document.documentElement.classList.remove('light');
              document.documentElement.style.backgroundColor = '#000';
              document.body.style.backgroundColor = '#000';
            }
          } catch (e) {}
        })();
    </script>
    <style>
        body { margin: 0; background: #000; font-family: 'Inter', sans-serif; cursor: crosshair; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
